# Reverse proxy for the gunicorn socket.
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/grd-backend
#           sudo ln -s /etc/nginx/sites-available/grd-backend /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Set server_name to the container's hostname / the domain it's served at.
#
# Static files (the Django admin's CSS/JS) are served by WhiteNoise inside
# gunicorn, so nginx just proxies everything and never touches /home/webadm.

upstream grd_backend {
    server unix:/run/grd-backend/gunicorn.sock;
}

server {
    listen 80;
    server_name _;                     # e.g. ci-bc-eos-1 / grd-backend.dfo-mpo.ca

    client_max_body_size 25m;

    location / {
        proxy_pass http://grd_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# For HTTPS, run `certbot --nginx` once this serves on port 80, or terminate TLS
# at whatever fronts the LXD host and leave this on port 80.
