# Reverse proxy for the gunicorn socket.
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/grd-backend
#           sudo ln -s /etc/nginx/sites-available/grd-backend /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Replace server_name with the container's hostname / the domain it's served at.

upstream grd_backend {
    server unix:/run/grd-backend/gunicorn.sock;
}

server {
    listen 80;
    server_name _;                     # e.g. grd-backend.dfo-mpo.ca

    client_max_body_size 25m;

    # Django admin static files (output of `manage.py collectstatic`).
    location /static/ {
        alias /opt/grd_backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://grd_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# For HTTPS, run `certbot --nginx` after this is serving on port 80, or terminate
# TLS at whatever sits in front of the LXD host and keep this on port 80.
